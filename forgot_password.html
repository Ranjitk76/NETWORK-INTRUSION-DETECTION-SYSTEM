<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NIDS - Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            NIDS
        </div>

        <h1>Forgot Password</h1>

        <p class="subtitle">
            Administrator Password Recovery
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="recovery_key">
                    Recovery Code
                </label>

                <input
                    type="password"
                    id="recovery_key"
                    name="recovery_key"
                    placeholder="Enter recovery code"
                    required
                >

            </div>

            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-button">

                RESET PASSWORD

            </button>

        </form>

        <div style="
            text-align:center;
            margin-top:18px;
        ">

            <a
                href="{{ url_for('login') }}"
                style="
                    color:#2563eb;
                    text-decoration:none;
                    font-weight:600;
                ">

                Back to Login

            </a>

        </div>

        <p class="footer-text">
            Authorized users only
        </p>

    </div>

</div>

</body>

</html>
